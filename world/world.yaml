planted:
  - {id: p.homonym-auth-service, kind: homonym, name: "Auth Service", hub: skillhub,
     entities: [svc.payment-auth, svc.identity-auth]}
  - id: p.four-names-payment-auth
    kind: hub_specific_names
    entity: svc.payment-auth
    names:
      skillhub: "Auth Service"
      memoryhub: "PA-svc"
      codehub: "repo:payments/payment-auth"
      dochub: "space:PA"
  - {id: p.retry-conflict, kind: conflict, facts: [f.retry-limit.impl, f.retry-limit.procedure],
     at: R42, artifacts: [a.code.retryconfig, a.skill.pa-retries]}
  - {id: p.retry-branching, kind: version_branching, artifact: a.code.retryconfig,
     refs: [R40, R42, exp-branch]}
  - {id: p.experiment-newer-not-applicable, kind: newer_not_applicable,
     artifact: a.code.retryconfig, newer_ref: exp-branch, applicable_ref: R42}
  - {id: p.retry-policy-duplicate, kind: exact_duplicate,
     artifacts: [a.doc.retry-policy, a.code.retry-policy-copy]}
  - {id: p.composite-auth-skill, kind: composite_subject, artifact: a.skill.auth-retries,
     about: [svc.payment-auth, svc.identity-auth]}
  - {id: p.fx-quote-gap, kind: coverage_gap, entity: svc.fx-quote}
  - id: p.dochub-injection
    kind: injection
    artifact: a.doc.injection
