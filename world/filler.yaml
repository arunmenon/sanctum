titles:
  skill:
    - "{{name}} {{word}} handling"
    - "{{Word}} checklist for {{name}}"
    - "{{name}}: {{word}}"
  page:
    - "{{Word}} process"
    - "{{Word}} decision record"
    - "Notes: {{word}}"
    - "{{Word}} FAQ"
