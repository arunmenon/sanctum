hubs:
  codehub:
    places:
    - native: repo:platform/search-index
      selects_for: svc.search-index
      acl:
      - platform-eng
    - native: repo:platform/mail-digest
      selects_for: svc.mail-digest
      acl:
      - platform-eng
    - native: repo:payments/price-rounding
      selects_for: svc.price-rounding
      acl:
      - payments-eng
    - native: repo:payments/report-export
      selects_for: svc.report-export
      acl:
      - payments-eng
  skillhub:
    names:
    - native: Lookup Store
      namespace: Platform
      denotes: svc.search-index
    - native: Morning Bulletin
      namespace: Platform
      denotes: svc.mail-digest
    - native: Amount Display
      namespace: Payments
      denotes: svc.price-rounding
    - native: Statement Files
      namespace: Payments
      denotes: svc.report-export
  dochub:
    places:
    - native: space:TUNING
      acl:
      - payments-eng
      - identity-eng
      - platform-eng
