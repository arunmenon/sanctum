# D2 stand-in provider (lab plan §7.3). Descriptors are pinned (HLD §9.7) and written from
# hub-visible structure; calibration is fitted by tools/fit_d2_standin.py on dev runs only.
descriptors:
  codehub: 'Source code and configuration per service repository: java classes, yaml config, constants such as max retries,
    batch size, timeout, pool size, worker count, page size; releases R40 R41 R42 and an experiment branch; implemented behavior'
  skillhub: 'Skills and runbooks per domain namespace: procedures, checklists, how to retry, cutover, rollback, drain, failover,
    paging; what should happen and how many times; intended procedure'
  dochub: 'Team reference pages per space: service overview, policies, backoff schedule, SLA, retry procedure pages, design
    notes, documentation'
  memoryhub: 'The caller''s own agent session notes: follow-ups, what I looked into last session, alerts and occurrences,
    scratch notes, earlier discussions'
bands:
  use: 0.7
  skip: 0.1
