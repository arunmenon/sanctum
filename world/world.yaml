      - {native: "Lookup Store", namespace: Platform, denotes: svc.search-index}   # D6 challenge slice
      - {native: "Morning Bulletin", namespace: Platform, denotes: svc.mail-digest}   # D6 challenge slice
      - {native: "Amount Display", namespace: Payments, denotes: svc.price-rounding}   # D6 challenge slice
      - {native: "Statement Files", namespace: Payments, denotes: svc.report-export}   # D6 challenge slice
    places:
