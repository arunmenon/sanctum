  skill:
    - "Do not run this during a freeze."
    - "Log what you changed in the channel."
    - "Prefer the dashboard over raw logs."
    - "Skip step two if {{word}} is already quiet."
  page:
    - "Owners review this page quarterly."
    - "Comments are welcome in the thread."
    - "Earlier versions of this page are out of date."
    - "Numbers reflect the last {{word}} review."
  session_note:
    - "Low priority."
    - "Need to double check with the owners."
    - "Might be stale by next week."
    - "Unrelated to the {{word}} work, but noted."
  ticket:
    - "Customer comms were sent."
    - "No data loss."
    - "Follow-up ticket filed."
