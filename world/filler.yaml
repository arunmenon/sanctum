domain_places:           # shared places per domain, declared by the core world
  skillhub: {payments: "skills/payments/", identity: "skills/identity/", platform: "skills/platform/"}
  incidenthub: {payments: "queue:PAYOPS", identity: "queue:IDOPS", platform: "queue:PLATOPS"}
domain_groups: {payments: payments-eng, identity: identity-eng, platform: platform-eng}
namespaces: {payments: Payments, identity: Identity, platform: Platform}

# Distinct filler artifacts per hub. Core adds 24 (plus 1 in incidenthub), so the four
# released hubs total 3,000. The per-service split is seeded; totals are fixed.
artifact_counts: {codehub: 1010, skillhub: 460, dochub: 790, memoryhub: 716, incidenthub: 180}

kinds:
  codehub: [java_class, yaml_config, markdown_doc]
  skillhub: [skill]
  dochub: [page]
  memoryhub: [session_note]
  incidenthub: [ticket]

# Version refs a filler artifact may carry (ordered). Hubs without version reads use "current".
version_refs:
  codehub: [R40, R41, R42, exp-branch]
  skillhub: [v1, v2, v3]
  dochub: [v1, v2]

class_stems: [Batch, Pool, Queue, Cache, Router, Window, Limit, Budget, Buffer, Checkpoint, Shard, Lease]
class_suffixes: [Config, Settings, Policy, Defaults]
words: [latency, throughput, backlog, cutover, rollback, warmup, drain, failover, rebalance,
        compaction, rotation, reconciliation, paging, sampling, eviction, quota]

# Code bodies are assembled: a header, 2-4 sampled fields (each with its own seeded value),
# optional comment. Retry and timeout constants appear here on purpose as decoys, so a grep
# for MAX_RETRIES returns many non-gold hits. Filler values are random and assert nothing.
java_headers:
  - "public final class {{class}} {"
  - "final class {{class}} {"
  - "public interface {{class}} {"
  - "public class {{class}} {"
  - "public record {{class}}() {"
java_fields:
  - "static final int MAX_RETRIES = {{param}};"
  - "static final int TIMEOUT_MS = {{param}};"
  - "static final long BACKOFF_MS = {{param}}L;"
  - "static final int RETRY_BUDGET = {{param}};"
  - "static final int MAX_BATCH = {{param}};"
  - "static final int POOL_SIZE = {{param}};"
  - "static final int QUEUE_DEPTH = {{param}};"
  - "static final int DEFAULT_PAGE_SIZE = {{param}};"
  - "static final Duration CONNECT_TIMEOUT = Duration.ofMillis({{param}});"
  - "static final int MAX_ATTEMPTS = {{param}};"
  - "private static final int WORKER_COUNT = {{param}};"
  - "private static final double JITTER = 0.{{param}};"
java_comments:
  - "/** Values tuned during the {{word}} review. */"
  - "// TODO: move to configuration once {{word}} settles."
  - "/** Defaults only; overridden per environment. */"
  - "// Keep in sync with the {{word}} dashboard alerts."
yaml_keys:
  - "max_retries: {{param}}"
  - "timeout_ms: {{param}}"
  - "backoff_ms: {{param}}"
  - "pool_size: {{param}}"
  - "interval_seconds: {{param}}"
  - "enabled: true"
  - "batch_size: {{param}}"
  - "max_attempts: {{param}}"
  - "queue_depth: {{param}}"
bodies:
  markdown_doc:
    - "Build notes for {{place}}. The {{word}} stage usually takes about {{param}} seconds."
    - "Operational notes: {{word}} is handled by the shared pipeline; expect {{param}} jobs per hour."
    - "## Local setup\n\nRun the {{word}} target first. A clean build takes roughly {{param}} seconds."
    - "Changelog: tightened {{word}} handling and raised the worker limit to {{param}}."
    - "This module owns {{word}}. Known limitation: at most {{param}} concurrent requests."
    - "## Retries\n\nClient calls retry up to {{param}} times with jittered backoff."
    - "Migration guide: bump the {{word}} schema, then run the backfill ({{param}} rows per batch)."
    - "Benchmarks: p99 {{word}} latency is {{param}} ms on the reference host."
    - "Ownership moved to this team last quarter. {{Word}} alerts route here after {{param}} minutes."
    - "Release checklist: tag, build, smoke test {{word}}, wait {{param}} minutes, promote."
  skill:
    - "Use this skill when {{name}} reports {{word}} problems. Check the dashboard, then drain at most {{param}} requests before escalating."
    - "For {{name}} {{word}} work, pause deploys, confirm the queue is below {{param}} items, and hand over to the owning team."
    - "Steps for {{name}}:\n1. Confirm the {{word}} alert is real.\n2. Retry at most {{param}} times.\n3. Escalate to the owners."
    - "{{name}} {{word}}: restart one worker at a time and wait {{param}} seconds between restarts."
    - "If {{name}} shows {{word}} for more than {{param}} minutes, roll back the last deploy."
    - "Before touching {{name}}, read the {{word}} notes. Timeouts above {{param}} ms need a second reviewer."
  page:
    - "This page describes the {{word}} process for the team that owns {{place}}. Review cadence: every {{param}} days."
    - "Decision record: {{word}} settings were reviewed; the agreed ceiling is {{param}} per minute."
    - "Runbook: when {{word}} alarms fire, retry the job up to {{param}} times, then page the owner."
    - "Meeting notes. Agreed to revisit {{word}} limits; current timeout is {{param}} ms."
    - "FAQ\n\nQ: How long does {{word}} take?\nA: Usually about {{param}} minutes."
    - "Onboarding: new engineers shadow {{word}} for {{param}} days before owning it."
  session_note:
    - "Looked into {{name}} {{word}} alerts; {{param}} occurrences in the last window. Follow up next session."
    - "Paired on {{name}} {{word}} cleanup. Left {{param}} items for tomorrow."
    - "{{name}}: tried bumping retries to {{param}} locally for {{word}}; reverted, not a real fix."
    - "Reminder to self: {{name}} {{word}} timeout looked like {{param}} ms in staging. Verify before quoting it."
    - "Asked about {{name}} {{word}}. Answer: roughly {{param}} per hour, nobody wrote it down."
    - "Spent the session reading {{name}} {{word}} code; {{param}} call sites to update."
  ticket:
    - "{{word}} degraded for {{param}} minutes. Mitigated by restarting workers."
    - "Alert fired for {{word}}; {{param}} customers saw errors before recovery."
    - "Retries exhausted after {{param}} attempts during {{word}}; manual replay done."
    - "Timeouts spiked to {{param}} ms during {{word}}. Root cause pending."
