  - {key: merchant-onboard, domain: payments, repo: "repo:payments/merchant-onboard", skill_name: "Merchant Onboarding", doc_space: "space:MERCHANTS", memory_name: "onboardr"}
  - {key: session-store, domain: identity, repo: "repo:identity/session-store", skill_name: "Session Store", doc_space: "space:SESSIONS", memory_name: "sessd"}
  - {key: mfa-broker, domain: identity, repo: "repo:identity/mfa-broker", skill_name: "MFA Broker", doc_space: "space:MFA", memory_name: "mfab"}
