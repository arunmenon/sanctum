# D6 challenge slice: an overlay on world/world.yaml, merged only when building
# build/world-challenge (tools/build_world.py --overlay world/challenge-d6.yaml). Added after E3 for
# measurement (discrepancy register row 25); never part of build/world. Every list here is appended to
# the base world's list of the same name; `hubs.<hub>.names/places` append to that hub.
entities:
- id: svc.search-index
  type: service
  member_of: domain.platform
- id: svc.mail-digest
  type: service
  member_of: domain.platform
- id: svc.price-rounding
  type: service
  member_of: domain.payments
- id: svc.report-export
  type: service
  member_of: domain.payments
