  - "Dashboards were refreshed after the last deploy."
  - "No customer impact was reported for this change."
  - "The on-call rotation was notified in advance."
  - "Follow-up items are tracked in the team backlog."
  - "Numbers here are approximate and may drift."
  - "Load tests ran in the staging cluster overnight."
  - "Owners agreed to revisit this next quarter."
  - "Alert thresholds were tuned to reduce noise."
  - "Logs are retained for thirty days by default."
