  - {key: password-reset, domain: identity, repo: "repo:identity/password-reset", skill_name: "Password Reset", doc_space: "space:PWRESET", memory_name: "pwresetd"}
  - {key: audit-trail, domain: identity, repo: "repo:identity/audit-trail", skill_name: "Audit Trail", doc_space: "space:AUDIT", memory_name: "auditd"}
  - {key: rate-limiter, domain: platform, repo: "repo:platform/rate-limiter", skill_name: "Rate Limiter", doc_space: "space:RATELIMIT", memory_name: "ratelimd"}
  - {key: config-server, domain: platform, repo: "repo:platform/config-server", skill_name: "Config Server", doc_space: "space:CONFIG", memory_name: "cfgsrv"}
