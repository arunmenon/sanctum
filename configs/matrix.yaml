# Configuration matrix (lab plan revised §6; HLD v5.1 §17.2).
# Every arm lists every switch explicitly so diffs are mechanical.
shared:            # identical in all arms; tools/config_diff.py refuses a comparison if these differ
  auth: test_issuer_broker
  applicability_enforcement: true
  budgets: {response_tokens: 4000, candidates: 60, calls: 8, deadline_ms: 3000}
  tokenizer: cl100k_base
  ranker: lexical_smoke          # becomes cross_encoder_pinned for the M5 B* profile
  exact_dedup: true
  conflict_extraction: typed_rules
  packing: reserve_conflict_witnesses
  corpus_profile: from_run_manifest
  failure_profile: from_run_manifest

arms:
  C1-naive:  {routing: fanout_all, assembly: concatenate, resolution: none,      translation: false, procedures: false, memory_store: none,   decision_provider: none}
  C1-fair:   {routing: fanout_all, assembly: common,      resolution: none,      translation: false, procedures: false, memory_store: none,   decision_provider: none}
  C2:        {routing: rules,      assembly: common,      resolution: none,      translation: false, procedures: registry_only, memory_store: none, decision_provider: none}
  C3:        {routing: rules,      assembly: common,      resolution: none,      translation: false, procedures: registry_only, memory_store: none, decision_provider: named}
  C4:        {routing: rules,      assembly: common,      resolution: denotes,   translation: true,  procedures: memory,        memory_store: relations, decision_provider: none}
  C4a-equivalent: {routing: rules, assembly: common,      resolution: denotes,   translation: true,  procedures: memory,        memory_store: tables,    decision_provider: none}
  C4a-label-only: {routing: rules, assembly: common,      resolution: label_only, translation: true, procedures: memory,        memory_store: tables,    decision_provider: none}
  C5:        {routing: rules,      assembly: common,      resolution: denotes,   translation: true,  procedures: memory,        memory_store: relations, decision_provider: named}

comparisons:       # primary comparisons and the ONLY switches allowed to differ
  Q2_routing:            {a: C1-fair, b: C2,  may_differ: [routing, procedures]}
  Q3a_memory_package:    {a: C2,      b: C4,  may_differ: [resolution, translation, procedures, memory_store], label: package_effect}
  Q3a_semantics_ablation: {a: C4a-equivalent, b: C4a-label-only, may_differ: [resolution]}   # both on tables, so only semantics differ
  Q3b_storage_equivalence: {a: C4,    b: C4a-equivalent, may_differ: [memory_store], expect: equivalent_plans}
  Q4_provider:           {a: C2,      b: C3,  may_differ: [decision_provider]}
  Q4_provider_memory:    {a: C4,      b: C5,  may_differ: [decision_provider]}
  descriptive_only:      {a: C1-naive, b: C1-fair, may_differ: [assembly], causal: false}
