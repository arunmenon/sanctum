[project]
name = "sanctum-lab"
version = "0.0.1"
description = "Sanctum Lab: evaluation harness for the Sanctum HLD (M0 scaffold)"
requires-python = "==3.12.*"
dependencies = [
  "pydantic==2.9.2",
  "pyyaml==6.0.2",
  # Newest mcp that installs with pydantic 2.9.2; mcp>=1.13 needs pydantic>=2.11, which
  # changes the frozen JSON schemas (discrepancy register row 10).
  "mcp==1.12.4",
]

[project.optional-dependencies]
dev = ["pytest==8.3.3"]
# tokenizer = ["tiktoken==<pin at M3>"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
