  - {key: card-vault, domain: payments, repo: "repo:payments/card-vault", skill_name: "Card Vault", doc_space: "space:CARDVAULT", memory_name: "vaultd"}
  - {key: chargeback-desk, domain: payments, repo: "repo:payments/chargeback-desk", skill_name: "Chargeback Desk", doc_space: "space:CHARGEBACK", memory_name: "cbdesk"}
  - {key: refund-engine, domain: payments, repo: "repo:payments/refund-engine", skill_name: "Refund Engine", doc_space: "space:REFUNDS", memory_name: "refundr"}
  - {key: settlement-batch, domain: payments, repo: "repo:payments/settlement-batch", skill_name: "Settlement Batch", doc_space: "space:SETTLE", memory_name: "settlr"}
  - {key: payout-router, domain: payments, repo: "repo:payments/payout-router", skill_name: "Payout Router", doc_space: "space:DISBURSE", memory_name: "payoutd"}
  - {key: invoice-render, domain: payments, repo: "repo:payments/invoice-render", skill_name: "Invoice Render", doc_space: "space:INVOICES", memory_name: "invoicer"}
